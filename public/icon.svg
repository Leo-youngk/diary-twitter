<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Telegram exact blue -->
    <linearGradient id="bg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#37aee2"/>
      <stop offset="100%" stop-color="#1e96c8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="25%" r="55%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!--
    A pen / stylus pointing upper-right at ~40°.
    Same diagonal energy as Telegram's paper plane.
    Two-tone white (body bright / underside dimmer) = Telegram's fold trick.
    Centered at (256, 268), rotated -40° around that point.
  -->
  <g transform="translate(256,258) rotate(-40)">

    <!-- Pen body (main, bright white) -->
    <rect x="-28" y="-148" width="56" height="224" rx="10"
          fill="white" opacity="0.97"/>

    <!-- Pen underside / shadow face (Telegram's two-tone depth) -->
    <rect x="6" y="-148" width="22" height="224" rx="10"
          fill="white" opacity="0.55"/>

    <!-- Ferrule (metal ring) -->
    <rect x="-28" y="68" width="56" height="16" rx="4"
          fill="white" opacity="0.70"/>

    <!-- Tapered tip -->
    <path d="M -28 84 L 28 84 L 16 130 L -16 130 Z"
          fill="white" opacity="0.92"/>

    <!-- Tip point -->
    <polygon points="-16,130 16,130 0,162"
             fill="white" opacity="0.85"/>

    <!-- Top end cap (slightly rounded) -->
    <rect x="-28" y="-162" width="56" height="20" rx="10"
          fill="white" opacity="0.65"/>

  </g>
</svg>
