<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark background: charcoal → deep navy diagonal -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#19263d"/>
    </linearGradient>

    <!-- Page: pure white → warm cream -->
    <linearGradient id="page" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0ebe1"/>
    </linearGradient>

    <!-- Subtle center glow (blue haze behind the page) -->
    <radialGradient id="glow" cx="50%" cy="52%" r="42%">
      <stop offset="0%"   stop-color="#1d9bf0" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1d9bf0" stop-opacity="0"/>
    </radialGradient>

    <!-- Book drop shadow -->
    <filter id="book-shadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="22"
                    flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <!-- Pen glow -->
    <filter id="pen-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="8"
                    flood-color="#1d9bf0" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- ── Background ─────────────────────────────────────── -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- ── Notebook body (open book, slight perspective) ──── -->
  <g filter="url(#book-shadow)">
    <!-- Shadow / back page — offset slightly right+down -->
    <path d="M278 142 L398 156 L390 374 L268 362 Z"
          fill="#d8d0c2" opacity="0.45"/>

    <!-- Left (main) page -->
    <path d="M116 156 L256 142 L264 362 L122 374 Z"
          fill="url(#page)"/>

    <!-- Right page -->
    <path d="M256 142 L398 156 L390 374 L264 362 Z"
          fill="url(#page)" opacity="0.72"/>

    <!-- Spine (blue vertical bar) -->
    <rect x="250" y="142" width="18" height="220" rx="5" fill="#1d9bf0"/>
  </g>

  <!-- ── Left-page content lines ────────────────────────── -->
  <!-- Title line — full blue -->
  <line x1="148" y1="200" x2="236" y2="199"
        stroke="#1d9bf0" stroke-width="9" stroke-linecap="round" opacity="0.95"/>
  <!-- Body lines — warm gray -->
  <line x1="148" y1="234" x2="232" y2="233"
        stroke="#a09488" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <line x1="148" y1="260" x2="238" y2="259"
        stroke="#a09488" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <line x1="148" y1="286" x2="220" y2="285"
        stroke="#a09488" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <line x1="148" y1="320" x2="234" y2="319"
        stroke="#a09488" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <line x1="148" y1="346" x2="210" y2="345"
        stroke="#a09488" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <!-- ── Pencil / pen (lower-right, rotated -38°) ────────── -->
  <g transform="translate(346 316) rotate(-38)" filter="url(#pen-glow)">
    <!-- Body -->
    <rect x="-11" y="-68" width="22" height="88" rx="5" fill="#fbbf24"/>
    <!-- Ferrule (metal band) -->
    <rect x="-11" y="18"  width="22" height="13" rx="2" fill="#d97706"/>
    <!-- Eraser (pink) -->
    <rect x="-9"  y="-74" width="18" height="12" rx="4" fill="#fca5a5"/>
    <!-- Wood taper -->
    <path d="M-11 31 L11 31 L6 52 L-6 52 Z" fill="#d4a878"/>
    <!-- Graphite tip -->
    <polygon points="-6,52 6,52 0,66" fill="#374151"/>
    <!-- Highlight on body -->
    <rect x="-4" y="-68" width="6" height="82" rx="3"
          fill="rgba(255,255,255,0.22)"/>
  </g>

  <!-- Blue ink dot at pencil tip -->
  <circle cx="348" cy="345" r="6" fill="#1d9bf0" opacity="0.9"
          filter="url(#pen-glow)"/>
</svg>
