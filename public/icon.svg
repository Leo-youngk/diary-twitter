<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 纯黑背景 -->
  <rect width="512" height="512" fill="#000000"/>

  <!--
    纸飞机 — 直接坐标，完整居中，Telegram 同款构图
    机头指向右上 (420, 108)，两翼后掠，折痕清晰
  -->

  <!-- 背面/下翼 (浅蓝灰，在白翼后方) -->
  <path d="M 420 108  L 88 392  L 260 274 Z"
        fill="#c8daea"/>

  <!-- 折痕阴影三角 -->
  <path d="M 260 274  L 88 392  L 188 348 Z"
        fill="#a9c9dd"/>

  <!-- 主翼 / 上翼 (亮白，主可见面) -->
  <path d="M 420 108  L 88 172  L 260 274 Z"
        fill="white"/>

  <!-- 机身内面 (衔接两翼的中间条) -->
  <path d="M 260 274  L 420 108  L 300 248 Z"
        fill="#daeaf5"/>
</svg>
