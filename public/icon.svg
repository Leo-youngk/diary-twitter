<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background: deep amber → rose → plum -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#d4500a"/>
      <stop offset="55%"  stop-color="#c0334e"/>
      <stop offset="100%" stop-color="#9d1a6b"/>
    </linearGradient>

    <!-- Soft top-center highlight (simulates studio light) -->
    <radialGradient id="shine" cx="50%" cy="18%" r="52%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Page: white → warm cream -->
    <linearGradient id="page" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf6ee"/>
    </linearGradient>

    <!-- Spine: dark burnt sienna -->
    <linearGradient id="spine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#7b1d0e"/>
      <stop offset="100%" stop-color="#5a1209"/>
    </linearGradient>

    <!-- Inner page shadow at spine join -->
    <linearGradient id="innerShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.09"/>
      <stop offset="20%"  stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Notebook drop shadow -->
    <filter id="bookShadow" x="-18%" y="-12%" width="136%" height="136%">
      <feDropShadow dx="0" dy="22" stdDeviation="30"
                    flood-color="#4a0818" flood-opacity="0.58"/>
    </filter>
  </defs>

  <!-- ── Background ─────────────────────────────────────────── -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#shine)"/>

  <!-- ── Notebook ───────────────────────────────────────────── -->
  <g filter="url(#bookShadow)">
    <!-- Full page body (rounded rect) -->
    <rect x="108" y="96" width="296" height="320" rx="18" fill="url(#page)"/>

    <!-- Spine strip — left side, only left corners rounded -->
    <rect x="108" y="96" width="52"  height="320" rx="18" fill="url(#spine)"/>
    <rect x="136" y="96" width="24"  height="320"         fill="url(#spine)"/>
  </g>

  <!-- Page-spine depth shadow -->
  <rect x="160" y="96" width="72" height="320" fill="url(#innerShadow)"/>

  <!-- ── Spine binding holes ────────────────────────────────── -->
  <circle cx="134" cy="180" r="7.5" fill="#3a0a05" opacity="0.65"/>
  <circle cx="134" cy="256" r="7.5" fill="#3a0a05" opacity="0.65"/>
  <circle cx="134" cy="332" r="7.5" fill="#3a0a05" opacity="0.65"/>

  <!-- ── Page content ───────────────────────────────────────── -->
  <!-- Title bar — bold rose, like a highlighted header -->
  <rect x="184" y="158" width="172" height="12" rx="6" fill="#c0334e" opacity="0.80"/>

  <!-- Body lines — warm gray, randomised lengths for natural feel -->
  <rect x="184" y="202" width="196" height="7.5" rx="3.5" fill="#b0a090" opacity="0.44"/>
  <rect x="184" y="228" width="178" height="7.5" rx="3.5" fill="#b0a090" opacity="0.44"/>
  <rect x="184" y="254" width="200" height="7.5" rx="3.5" fill="#b0a090" opacity="0.44"/>
  <rect x="184" y="280" width="158" height="7.5" rx="3.5" fill="#b0a090" opacity="0.44"/>
  <rect x="184" y="306" width="188" height="7.5" rx="3.5" fill="#b0a090" opacity="0.37"/>
  <rect x="184" y="332" width="136" height="7.5" rx="3.5" fill="#b0a090" opacity="0.30"/>

  <!-- ── Notebook edge highlight (rim light) ───────────────── -->
  <rect x="108" y="96" width="296" height="320" rx="18"
        fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
</svg>
