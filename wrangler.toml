name = "diary-app"
# Pinned so a token for another account fails instead of deploying there.
account_id = "8f92f605a9c8c7e4872d8869c72e1a59"
main = "./worker/index.ts"
compatibility_date = "2026-08-04"

[[d1_databases]]
binding = "DB"
database_name = "diary-pwa-db"
database_id = "709caf1f-c209-4d1a-a123-272b7860c543"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]

[assets]
# The client is a single-page app; unknown paths fall back to index.html.
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# The app's one data space: it holds the synced store, relays changes
# between devices, and delivers to X / Obsidian from its alarm.
[[durable_objects.bindings]]
name = "SPACES"
class_name = "DiarySpace"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DiarySpace"]

[[durable_objects.bindings]]
name = "DIARY"
class_name = "D1Diary"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["D1Diary"]

# Images and daily backups.
[[kv_namespaces]]
binding = "DATA_KV"
id = "11eb7cdef6914b4f8af8f2a21b251ded"

# Keeps console output (sync, X and Obsidian delivery) for the dashboard.
[observability]
enabled = true

[vars]
# 只放公开的目标接口地址与频道。密钥用 `npm run secrets` 从 .env.secrets.local 推送：
# SPACE_ID、APP_PASSPHRASE、SESSION_SECRET、BUFFER_API_KEY、OBSIDIAN_SYNC_SECRET。
OBSIDIAN_SYNC_URL = "https://obsidian-ios-pwa.if5v.workers.dev/api/integrations/twitter"
BUFFER_CHANNEL_ID = "6abb7219ea19ca0bde20241e"
